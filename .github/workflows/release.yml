name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble staging
        shell: powershell
        run: node tools/assemble-dist.js --version ${{ github.ref_name }} --out dist
      - name: Build zip (flat root)
        shell: powershell
        run: Compress-Archive -Path "dist/site/*" -DestinationPath "dist/chip-pin-planner-${{ github.ref_name }}.zip"
      - name: Stage download/ for Pages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist/site/download | Out-Null
          Copy-Item "dist/chip-pin-planner-${{ github.ref_name }}.zip" "dist/site/download/latest.zip"
          Copy-Item "dist/site/version.json" "dist/site/download/version.json"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ github.ref_name }} /DSrc=${{ github.workspace }}\dist\site installer\chip-pin-planner.iss
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Release notes
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $prev = $null
          if (git rev-parse --verify --quiet "HEAD^") {
            $prev = @(git tag --merged "HEAD^" --list "v*" --sort=-v:refname)[0]
          }
          # 兼容旧 tag 与新分支不在同一祖先线的情况；
          # baseline 比当前已合并 tag 更新时，用 baseline 作为增量起点。
          if (Test-Path ".release-baseline") {
            $base = (Get-Content ".release-baseline" -Raw).Trim()
            if ($base -and (git rev-parse --verify --quiet $base)) {
              $baseIsOlder = $false
              if ($prev) {
                git merge-base --is-ancestor $base $prev
                $baseIsOlder = ($LASTEXITCODE -eq 0)
              }
              if (-not $baseIsOlder) { $prev = $base }
            }
          }
          if ($prev) {
            git log "$prev..HEAD" --pretty="- %s" | Out-File -Encoding utf8 notes.md
          } else {
            git log HEAD --pretty="- %s" | Out-File -Encoding utf8 notes.md
          }
      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/chip-pin-planner-${{ github.ref_name }}.zip" "dist/chip-pin-planner-setup-${{ github.ref_name }}.exe" --title "${{ github.ref_name }}" --notes-file notes.md
