name: Bug 反馈
description: 报告使用中遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认用的是**最新版**（在线版或最新 Release），并尽量附上截图。
        使用问题也可以先看 [使用教程](https://github.com/amadeus-1048596/chip-pin-planner/blob/master/docs/user-guide.md)。

  - type: input
    id: environment
    attributes:
      label: 版本与浏览器
      placeholder: 在线版 / v1.9 zip / setup.exe；Chrome 141 / Edge 141
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，按顺序写清楚点了哪里。
      placeholder: |
        1. 选择 CH582M
        2. 点击 PA4
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴出控制台信息或截图。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 工程文件、芯片型号、手册页码等。
